version: "0.2.0"
disambiguatingDescription: Memar / Khayyam via live documentation.
description: >
  A system-development framework as structure document: a structuralism
  mental model for constructing, examining, and refining models of systems.
abstract: >
  Use Memar's approach in any project — not only inside this repository.
  Operating practices for Memar and Khayyam discover live documentation from
  the GeniusesGroup/memar root (workspace, sibling checkout, or shallow clone
  named memar). Markdown and Git paths resolve against that root, not against
  a skill install path. The bundled skill is a routing practice into that
  tree, not a second copy of it.
