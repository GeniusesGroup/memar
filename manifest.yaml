name: Memar
alternateName: Memar / Khayyam
version: "0.2.0"
disambiguatingDescription: Memar / Khayyam via live documentation.
description: >
  A system-development framework as structure document: a structuralism
  mental model for constructing, examining, and refining models of systems.
abstract: >
  Memar's model is a live documentation tree, and the agent configuration under
  .agents/ is a router into it rather than a second copy: a skill, one
  navigation tool, and the installers. Document paths in that tree are written
  relative to the Memar repository root, which one environment variable names on
  the machine where the work happens.
